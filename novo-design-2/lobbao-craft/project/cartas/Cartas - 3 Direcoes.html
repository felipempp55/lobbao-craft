<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lobbão Craft — 3 Direções de Carta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Permanent+Marker&display=swap');

  html, body { margin: 0; padding: 0; background: #16110f; }
  * { box-sizing: border-box; }

  /* fumaça à deriva */
  @keyframes lbcSmokeDrift {
    0%   { background-position: 20% 10%; }
    50%  { background-position: 26% 16%; }
    100% { background-position: 20% 10%; }
  }
  .lbc-smoke { animation: lbcSmokeDrift 14s ease-in-out infinite; }

  /* shine diagonal */
  @keyframes lbcShine {
    0%   { transform: translateX(-120%); }
    60%, 100% { transform: translateX(120%); }
  }
  .lbc-shine { animation: lbcShine 4.2s ease-in-out infinite; }

  /* anel pulsante */
  @keyframes lbcPulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.9; }
  }
  .lbc-pulse { animation: lbcPulse 3s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#16110f"/>
    <rect x="34" y="24" width="32" height="48" rx="4" fill="#1a0606" stroke="#cc1111" stroke-width="2"/>
    <text x="50" y="50" font-family="sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">95</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const T = window.TIERS;
  const order = ['bagre', 'dream', 'goat'];

  function Frame({ children }) {
    return <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{children}</div>;
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="refino" title="Direção A · Refino TOTW" subtitle="Mesma alma FIFA, mais polida — smoke vermelho da live, pincelada branca, tipografia CS2 (Chakra Petch + Saira Condensed)">
          {order.map(k => (
            <DCArtboard key={k} id={'A-' + k} label={T[k].name + ' · ' + T[k].range} width={310} height={452}>
              <Frame><window.CardRefino t={T[k]} /></Frame>
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="skin" title="Direção B · CS2 Skin / Wear" subtitle="Agressiva — item de inventário CS2: cantos chanfrados, faixa de raridade, barra de float/wear, contador StatTrak™ no overall">
          {order.map(k => (
            <DCArtboard key={k} id={'B-' + k} label={T[k].rarity + ' · ' + T[k].wear} width={314} height={452}>
              <Frame><window.CardSkin t={T[k]} /></Frame>
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="smoke" title="Direção C · Smoke Drop" subtitle="Cinematográfica — pôster com fumaça densa + pincelada hero, número gigante sobreposto. Pensada pra revelação 'pack opening'">
          {order.map(k => (
            <DCArtboard key={k} id={'C-' + k} label={T[k].name + ' · OV ' + T[k].ov} width={312} height={454}>
              <Frame><window.CardSmoke t={T[k]} /></Frame>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
