<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lobbão Craft</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Permanent+Marker&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #16110f; min-height: 100%; }
  body { font-family: 'Rajdhani', sans-serif; }
  ::selection { background: rgba(204,17,17,0.4); color: #fff; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0a0606; }
  ::-webkit-scrollbar-thumb { background: #3a1414; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #cc1111; }

  /* ── fumaça à deriva ── */
  @keyframes lbcSmokeDrift { 0%{background-position:20% 10%;}50%{background-position:26% 16%;}100%{background-position:20% 10%;} }
  .lbc-smoke { animation: lbcSmokeDrift 16s ease-in-out infinite; }

  /* ── shine diagonal ── */
  @keyframes lbcShine { 0%{transform:translateX(-130%);}60%,100%{transform:translateX(130%);} }
  .lbc-shine { animation: lbcShine 4.5s ease-in-out infinite; }

  /* ── anel pulsante ── */
  @keyframes lbcPulse { 0%,100%{opacity:.35;}50%{opacity:.9;} }
  .lbc-pulse { animation: lbcPulse 3s ease-in-out infinite; }

  /* ── sparkle ── */
  @keyframes lbcSparkle { 0%,100%{opacity:0;transform:scale(.5);}50%{opacity:1;transform:scale(1.3);} }
  .lbc-spark { animation: lbcSparkle 2.2s ease-in-out infinite; }

  /* ── linha vermelha header ── */
  @keyframes lbcHdrLine { 0%{background-position:0% 0;}100%{background-position:200% 0;} }
  .lbc-hdr-line { animation: lbcHdrLine 5s linear infinite; }

  /* ── card pop-in (grid stagger) ── */
  @keyframes lbcPop { 0%{opacity:0;transform:translateY(24px) scale(.94);}100%{opacity:1;transform:none;} }
  .lbc-pop { animation: lbcPop .5s cubic-bezier(.2,.7,.3,1) backwards; }

  /* ── screen fade ── */
  @keyframes lbcScreen { 0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:none;} }
  .lbc-screen { animation: lbcScreen .35s ease-out; }

  /* ── pack opening ── */
  @keyframes lbcPackSwipe { 0%{transform:translate(-60%,-50%) rotate(-7deg);opacity:0;}40%{opacity:.95;}100%{transform:translate(40%,-50%) rotate(-7deg);opacity:0;} }
  @keyframes lbcPackCardIn { 0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotateY(45deg);}60%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotateY(-6deg);}100%{transform:translate(-50%,-50%) scale(1) rotateY(0);} }
  @keyframes lbcPackBurst { 0%{width:60px;height:60px;opacity:.9;}100%{width:780px;height:780px;opacity:0;} }
  @keyframes lbcPackTierIn { 0%{opacity:0;letter-spacing:40px;}100%{opacity:1;letter-spacing:14px;} }
  @keyframes lbcPackCue { 0%{opacity:0;}100%{opacity:1;} }

  /* ── range slider (HUD) ── */
  .lbc-range { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; outline:none; cursor:pointer;
    background: linear-gradient(90deg, var(--c) var(--p), rgba(255,255,255,0.09) var(--p)); }
  .lbc-range::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:3px solid var(--c); box-shadow:0 0 10px var(--c), 0 2px 6px rgba(0,0,0,.5); cursor:pointer; transition:transform .1s; }
  .lbc-range::-webkit-slider-thumb:hover { transform:scale(1.18); }
  .lbc-range::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid var(--c); box-shadow:0 0 10px var(--c); cursor:pointer; }

  /* ═══════════════════════════════════════════════════════════ */
  /*  TWEAKS — atmosfera (vibe / fumaça / pulso)                */
  /* ═══════════════════════════════════════════════════════════ */

  /* VIBE — atmosphere swap via CSS vars consumed by PageBg */
  [data-vibe="estadio"] {
    --lbc-page-bg: radial-gradient(120% 80% at 50% -10%, #1a2a78, #050a30 55%, #00041e 100%);
    --lbc-page-corner: radial-gradient(circle at 0% 100%, rgba(255,200,80,0.10), transparent 60%);
    --lbc-vibe-overlay: radial-gradient(70% 50% at 60% 18%, rgba(255,215,0,0.10), transparent 60%);
  }
  [data-vibe="estadio"] header > div:first-child { background: linear-gradient(180deg, #06122c, #0a1c52 55%, #06122c) !important; }
  [data-vibe="estadio"] header > div[style*="radial-gradient(circle"] { background: radial-gradient(circle, rgba(255,215,0,0.35), transparent 70%) !important; }
  [data-vibe="estadio"] .lbc-hdr-line { background: linear-gradient(90deg, transparent, #ffd700 30%, #ffeeb0 50%, #ffd700 70%, transparent) !important; background-size: 200% 100% !important; }
  [data-vibe="estadio"] div[style*="smoke-red"] { filter: hue-rotate(34deg) saturate(0.9) !important; }

  [data-vibe="tatico"] {
    --lbc-page-bg: radial-gradient(120% 80% at 50% -10%, #0c1820, #050c12 55%, #02060a 100%);
    --lbc-page-corner: radial-gradient(circle at 0% 100%, rgba(0,200,230,0.12), transparent 60%);
    --lbc-vibe-overlay: linear-gradient(180deg, rgba(0,200,230,0.05), transparent 45%);
  }
  [data-vibe="tatico"] header > div:first-child { background: linear-gradient(180deg, #050a0e, #0a1218 55%, #050a0e) !important; }
  [data-vibe="tatico"] header > div[style*="radial-gradient(circle"] { background: radial-gradient(circle, rgba(0,200,230,0.30), transparent 70%) !important; }
  [data-vibe="tatico"] .lbc-hdr-line { background: linear-gradient(90deg, transparent, #00c8e6 30%, #ffffff 50%, #00c8e6 70%, transparent) !important; background-size: 200% 100% !important; }
  [data-vibe="tatico"] div[style*="smoke-red"] { filter: hue-rotate(180deg) saturate(0.35) brightness(0.85) !important; }

  /* FUMAÇA — density of the live aesthetic across all chrome */
  [data-fumaca="limpo"] div[style*="smoke-red"] { opacity: 0.08 !important; }
  [data-fumaca="limpo"] img[src*="paint-swoosh"] { opacity: 0.04 !important; }
  [data-fumaca="cinema"] div[style*="smoke-red"] { filter: saturate(1.35) brightness(1.1); }
  [data-fumaca="cinema"] .lbc-page-bg div[style*="smoke-red"] { opacity: 0.7 !important; }
  [data-fumaca="cinema"] img[src*="paint-swoosh"] { opacity: 0.22 !important; }
  [data-fumaca="cinema"] header { box-shadow: 0 4px 28px rgba(204,17,17,0.35); }
  [data-vibe="estadio"][data-fumaca="cinema"] header { box-shadow: 0 4px 28px rgba(255,215,0,0.30); }
  [data-vibe="tatico"][data-fumaca="cinema"] header { box-shadow: 0 4px 28px rgba(0,200,230,0.30); }

  /* PULSO — global animation tempo */
  [data-pulso="parado"] .lbc-smoke,
  [data-pulso="parado"] .lbc-shine,
  [data-pulso="parado"] .lbc-pulse,
  [data-pulso="parado"] .lbc-spark,
  [data-pulso="parado"] .lbc-hdr-line { animation: none !important; }
  [data-pulso="parado"] .lbc-pop,
  [data-pulso="parado"] .lbc-screen { animation-duration: 0.001s !important; }

  [data-pulso="hype"] .lbc-smoke   { animation-duration: 6s   !important; }
  [data-pulso="hype"] .lbc-shine   { animation-duration: 2s   !important; }
  [data-pulso="hype"] .lbc-pulse   { animation-duration: 1.2s !important; }
  [data-pulso="hype"] .lbc-spark   { animation-duration: 1.2s !important; }
  [data-pulso="hype"] .lbc-hdr-line{ animation-duration: 2.4s !important; }
  [data-pulso="hype"] .lbc-pop     { animation-duration: 0.35s !important; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#16110f"/>
    <rect x="34" y="22" width="32" height="52" rx="4" fill="#1a0606" stroke="#cc1111" stroke-width="2"/>
    <text x="50" y="46" font-family="sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">95</text>
    <text x="50" y="64" font-family="sans-serif" font-size="6" font-weight="700" fill="#cc1111" text-anchor="middle">LOBBÃO</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="card.jsx"></script>
<script type="text/babel" src="pack.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-3.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;
  const { PageBg, Header, Nav,
          LoginScreen, HomeScreen, SundayScreen, PlayersScreen,
          HistoryScreen, AttrsScreen, ConfigScreen,
          useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "vibe": "live",
    "fumaca": "padrao",
    "pulso": "vivo"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [authed, setAuthed] = useState(() => localStorage.getItem('lbc_auth') === '1');
    const [tab, setTab] = useState(() => localStorage.getItem('lbc_tab') || 'home');

    // sync tweaks → root data-attrs so CSS variants apply globally
    useEffect(() => {
      const r = document.documentElement;
      r.setAttribute('data-vibe',   t.vibe);
      r.setAttribute('data-fumaca', t.fumaca);
      r.setAttribute('data-pulso',  t.pulso);
    }, [t.vibe, t.fumaca, t.pulso]);

    const go = id => { setTab(id); localStorage.setItem('lbc_tab', id); };
    const login = () => { setAuthed(true); localStorage.setItem('lbc_auth', '1'); };
    const logout = () => { setAuthed(false); localStorage.removeItem('lbc_auth'); };

    const panel = (
      <TweaksPanel>
        <TweakSection label="Atmosfera" />
        <TweakRadio label="Vibe" value={t.vibe}
                    options={[{ value:'live', label:'Lobbão' }, { value:'estadio', label:'Estádio' }, { value:'tatico', label:'Tático' }]}
                    onChange={v => setTweak('vibe', v)} />
        <TweakRadio label="Fumaça" value={t.fumaca}
                    options={[{ value:'limpo', label:'Limpo' }, { value:'padrao', label:'Padrão' }, { value:'cinema', label:'Cinema' }]}
                    onChange={v => setTweak('fumaca', v)} />
        <TweakRadio label="Pulso" value={t.pulso}
                    options={[{ value:'parado', label:'Parado' }, { value:'vivo', label:'Vivo' }, { value:'hype', label:'Hype' }]}
                    onChange={v => setTweak('pulso', v)} />
      </TweaksPanel>
    );

    if (!authed) return <>{panel}<LoginScreen onLogin={login} /></>;

    const screens = {
      home:    <HomeScreen onGoSunday={() => go('sunday')} />,
      players: <PlayersScreen />,
      attrs:   <AttrsScreen />,
      sunday:  <SundayScreen />,
      hist:    <HistoryScreen />,
      config:  <ConfigScreen onLogout={logout} />,
    };

    return (
      <div style={{ position: 'relative', minHeight: '100vh' }}>
        <PageBg />
        <div style={{ position: 'relative', zIndex: 1 }}>
          <Header onLogout={logout} />
          <Nav active={tab} onChange={go} />
          <main key={tab} className="lbc-screen">{screens[tab]}</main>
        </div>
        {panel}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
